/* Mini runtime: renders the artifact's <x-dc> templates + DCLogic components as plain web code. */
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(p, cb) {
    Object.assign(this.state, typeof p === 'function' ? p(this.state) : p);
    if (cb) (this.__cbs || (this.__cbs = [])).push(cb);
    if (this.__queue) this.__queue(); else if (this.__cbs) { const c = this.__cbs; this.__cbs = null; c.forEach((f) => f()); }
  }
}
(function () {
  const HOLE = /\{\{\s*([\w$.]+)\s*\}\}/g, WHOLE = /^\s*\{\{\s*([\w$.]+)\s*\}\}\s*$/;
  const SVG = 'http://www.w3.org/2000/svg';
  const look = (path, scope) => { let v = scope; for (const k of path.split('.')) { if (v == null) return undefined; v = v[k]; } return v; };
  const fill = (s, scope) => s.replace(HOLE, (_, p) => { const v = look(p, scope); return v == null || v === false ? '' : String(v); });

  function build(node, scope, view) {
    if (node.nodeType === 3) return [document.createTextNode(node.nodeValue.includes('{{') ? fill(node.nodeValue, scope) : node.nodeValue)];
    if (node.nodeType !== 1) return [];
    const tag = node.localName;
    if (tag === 'sc-for' || tag === 'sc-if') {
      const g = node.namespaceURI === SVG ? document.createElementNS(SVG, 'g') : document.createElement('dc-g');
      if (!(node.namespaceURI === SVG)) g.style.display = 'contents';
      let items = null;
      if (tag === 'sc-for') {
        const m = WHOLE.exec(node.getAttribute('list') || ''); const list = m ? look(m[1], scope) : null;
        const as = node.getAttribute('as') || 'item';
        items = Array.isArray(list) ? list.map((it, i) => ({ ...scope, [as]: it, index: i })) : [];
      } else {
        const m = WHOLE.exec(node.getAttribute('value') || ''); items = m && look(m[1], scope) ? [scope] : [];
      }
      for (const sc of items) for (const c of node.childNodes) for (const n of build(c, sc, view)) g.appendChild(n);
      return [g];
    }
    const el = node.cloneNode(false);
    for (const a of [...node.attributes]) {
      const name = a.name, val = a.value;
      if (name.startsWith('hint-')) { el.removeAttribute(name); continue; }
      if (/^on[a-z]+$/.test(name) && WHOLE.test(val)) {
        el.removeAttribute(name);
        const fn = look(WHOLE.exec(val)[1], scope);
        if (typeof fn === 'function') { (el.__h || (el.__h = {}))[name.slice(2)] = fn; view.listen(name.slice(2)); }
        continue;
      }
      if (!val.includes('{{')) continue;
      const w = WHOLE.exec(val);
      if (w) { const v = look(w[1], scope); if (v === false || v == null) el.removeAttribute(name); else el.setAttribute(name, v === true ? '' : String(v)); }
      else el.setAttribute(name, fill(val, scope));
    }
    for (const c of node.childNodes) for (const n of build(c, scope, view)) el.appendChild(n);
    return [el];
  }

  function attrs(el) { const o = {}; for (const a of el.attributes) o[a.name] = a.value; return o; }
  function patch(live, neu) {
    const prev = live.__a || attrs(live), next = attrs(neu);
    for (const k in next) if (prev[k] !== next[k]) live.setAttribute(k, next[k]);
    for (const k in prev) if (!(k in next)) live.removeAttribute(k);
    live.__a = next; live.__h = neu.__h;
    kids(live, neu);
  }
  function kids(live, neu) {
    const nc = [...neu.childNodes];
    nc.forEach((b, i) => {
      const a = live.childNodes[i];
      if (!a) live.appendChild(b);
      else if (a.nodeType === b.nodeType && (a.nodeType === 3 || a.nodeName === b.nodeName)) {
        if (a.nodeType === 3) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; } else patch(a, b);
      } else live.replaceChild(b, a);
    });
    while (live.childNodes.length > nc.length) live.removeChild(live.lastChild);
  }

  const BUBBLE_OFF = { mouseleave: 1, mouseenter: 1 };
  window.dcMount = function (host, Component, templateHTML, css) {
    const root = host.attachShadow({ mode: 'open' });
    const style = document.createElement('style'); style.textContent = '.dc-scroll{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto}\n' + css; root.appendChild(style);
    const wrap = document.createElement('div'); wrap.className = 'dc-scroll'; root.appendChild(wrap);
    const tpl = document.createElement('template'); tpl.innerHTML = templateHTML;
    const comp = new Component(); comp.root = root;
    const listening = {};
    const view = {
      listen(type) {
        if (listening[type]) return; listening[type] = 1;
        root.addEventListener(type, (e) => {
          const path = BUBBLE_OFF[type] ? [e.target] : e.composedPath();
          let stopped = false;
          for (const n of path) {
            if (n === root) break;
            const h = n.__h && n.__h[type]; if (!h) continue;
            const ev = new Proxy(e, { get(t, k) {
              if (k === 'currentTarget') return n;
              if (k === 'stopPropagation') return () => { stopped = true; };
              const v = t[k]; return typeof v === 'function' ? v.bind(t) : v; } });
            h.call(comp, ev); if (stopped) break;
          }
        }, !!BUBBLE_OFF[type]);
      },
    };
    let queued = false;
    const render = () => {
      queued = false;
      const tmp = document.createElement('div');
      for (const c of tpl.content.childNodes) for (const n of build(c, comp.renderVals(), view)) tmp.appendChild(n);
      kids(wrap, tmp);
      if (comp.__cbs) { const c = comp.__cbs; comp.__cbs = null; c.forEach((f) => f()); }
    };
    comp.__queue = () => { if (!queued) { queued = true; Promise.resolve().then(render); } };
    root.addEventListener('click', (e) => { // links between views and in-page anchors
      const a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
      const h = a.getAttribute('href');
      if (/(^|\/)Recruiter\.dc\.html$/.test(h)) { e.preventDefault(); window.dcGo('rec'); }
      else if (/(^|\/)Main\.dc\.html$/.test(h)) { e.preventDefault(); window.dcGo('depot'); }
      else if (h.startsWith('#') && h.length > 1) { e.preventDefault(); const t = root.getElementById(h.slice(1)); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    });
    render();
    if (comp.componentDidMount) comp.componentDidMount();
    return comp;
  };

  const views = {};
  window.dcRegister = (name, host, make) => { views[name] = { host, make, comp: null }; };
  window.dcGo = function (name) {
    for (const k in views) views[k].host.style.display = k === name ? 'block' : 'none';
    const v = views[name]; if (!v.comp) v.comp = v.make(); else if (v.comp.onShow) v.comp.onShow();
    try { history.replaceState(null, '', name === 'rec' ? '#recruiter' : location.pathname + location.search); } catch (e) { /* file: */ }
  };
})();
